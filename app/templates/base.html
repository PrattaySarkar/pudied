<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}PUDIED{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}"></head>
<body>

<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body></html>
