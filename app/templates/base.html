<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}PUDIED{% endblock %}</title><link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}"><style>.refresh-button{width:100%;text-align:left;border-top:0;border-left:0;border-right:0;background:transparent;font:inherit;cursor:pointer}.refresh-button:hover{color:var(--accent-dark)}.refresh-button:disabled{cursor:wait;opacity:.65}.refresh-status{display:block;color:var(--muted);font-size:.78rem;margin-top:6px}</style></head>
<body>
<header class="site-header"><a class="brand" href="/"><span>PUDIED</span><small>Prattay's Urban Dictionary of Interesting Engineering Decisions</small></a><nav><a href="/tree">Browse tree</a><a href="/index">Index</a></nav></header>
<main class="layout"><aside class="sidebar"><form action="/search"><label for="nav-search">Search the wiki</label><div class="search-box"><input id="nav-search" name="q" placeholder="Try cable..." value="{{ request.query_params.get('q', '') }}"><button>⌕</button></div></form><a class="side-link" href="/tree">▾ Full category tree</a><button class="side-link refresh-button" type="button" data-refresh>↻ Refresh index</button><span class="refresh-status" data-refresh-status role="status" aria-live="polite"></span></aside><section class="content">{% block content %}{% endblock %}</section></main>
<footer>Built for constraints, improvisation, and decisions that deserve documentation.</footer>
<script src="{{ url_for('static', path='js/app.js') }}"></script>
</body></html>
